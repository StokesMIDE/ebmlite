name: Unit test on push and PR


on: [push, pull_request, workflow_dispatch]


jobs:
  unit-tests:
    name: Run Unit Tests

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    env:
      OS: ${{ matrix.os }}
      PYTHON-VERSION: ${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip

      - uses: actions/checkout@v4

      # Editable install, so the C extension is built in the source tree
      # (which is what the tests import).
      - run: python -m pip install -e .[test]

      - name: Verify the C extension was built
        run: python -c "import ebmlite.decoding as d; assert d._cebml is not None, 'C extension not built'"

      - run: python -m pytest ./tests/ --cov=ebmlite --cov-report=xml -n auto

      - name: Run tests without the C extension (pure Python)
        run: python -m pytest ./tests/ -n auto
        env:
          EBMLITE_NO_C: 1

#      - uses: actions/upload-artifact@v4
#        with:
#          name: multi-file-stuff
#          overwrite: true
#          path: |
#            ./tests/SSX46714-doesnot.IDE
#            ./tests/SSX46714-new.IDE
#            ./tests/ssx-1.xml
#            ./tests/ssx-2.xml

      - uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS,PYTHON-VERSION
          files: ./coverage.xml
          name: ${{ matrix.os }} ${{ matrix.python-version }}
          verbose: true
